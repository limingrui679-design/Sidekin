<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidekin</title>
    <link rel="stylesheet" href="floating.css">
  </head>
  <body>
    <main class="float-root">
      <section class="pet-zone" id="pet-zone">
        <div class="status-pill" role="status" aria-live="polite"><i id="float-status-dot"></i><span id="float-status">Resting</span><strong id="float-timer"></strong></div>
        <div class="pet-motion" id="pet-motion">
          <img id="float-pet" alt="Sidekin desktop companion" draggable="false">
          <span class="effect sleep-effect">Z<span>z</span></span>
          <span class="effect feed-effect">● · ●</span>
          <span class="effect play-effect">✦</span>
          <span class="effect fail-effect">!</span>
          <span class="scan-line"></span>
        </div>
        <div class="quick-actions">
          <button data-care="feed" title="Feed" aria-label="Feed Sidekin">●</button>
          <button data-care="play" title="Play" aria-label="Play with Sidekin">✦</button>
          <button data-care="sleepOrWake" id="float-sleep" title="Sleep or wake" aria-label="Sleep or wake Sidekin">☾</button>
          <button id="open-center" title="Open Command Center" aria-label="Open Sidekin Command Center">⌃</button>
        </div>
      </section>
      <section class="task-stack" id="float-task-stack" aria-label="Recent agent tasks" aria-live="polite"></section>
    </main>
    <script src="floating.js"></script>
  </body>
</html>
