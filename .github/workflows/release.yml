name: Publish source Beta prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: ./Scripts/verify-theme-catalog.sh && swift Scripts/verify-lineage-audit.swift
      - run: npm run make
      - if: runner.os == 'macOS'
        run: ./Scripts/package-source.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sidekin-release-${{ runner.os }}
          path: |
            out/make/**
            artifacts/Sidekin-*-GitHub-Source.zip
            artifacts/Sidekin-*-GitHub-Source.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Sidekin-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release sidecars
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' sidecar; do
            (cd "$(dirname "$sidecar")" && sha256sum --check "$(basename "$sidecar")")
          done < <(find release-assets -type f -name '*.sha256' -print0)
          test "$(find release-assets -type f -name '*.zip' | wc -l)" -ge 3
      - name: Publish transparent source Beta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          test -f "$notes_file"
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.sha256' -o -name 'package-report-*.json' \) -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --prerelease \
            --title "Sidekin ${GITHUB_REF_NAME#v} source Beta" \
            --notes-file "$notes_file"
