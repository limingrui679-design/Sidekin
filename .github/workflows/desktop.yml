name: Desktop verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: ./Scripts/verify-theme-catalog.sh && swift Scripts/verify-lineage-audit.swift
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: Sidekin-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
