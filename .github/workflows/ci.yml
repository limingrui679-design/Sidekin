name: CainiaoPet CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift environment
        run: swift --version

      - name: Run source, mock API, asset, and release builds
        run: ./Scripts/run-all-checks.sh
