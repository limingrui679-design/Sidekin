name: Sidekin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Swift environment
        run: swift --version

      - name: Run source, mock API, asset, and release builds
        run: ./Scripts/run-all-checks.sh

      - name: Build and verify arm64 beta archive
        run: ./Scripts/package-release.sh

      - name: Verify archive provenance
        shell: bash
        run: |
          set -euo pipefail
          manifest="artifacts/Sidekin-macOS-arm64.RELEASE.json"
          commit="$(swift Scripts/read-release-manifest.swift "$manifest" sourceCommit)"
          dirty="$(swift Scripts/read-release-manifest.swift "$manifest" sourceDirty)"
          test "$commit" = "$GITHUB_SHA"
          test "$dirty" = "0"

      - name: Retain verified beta archive
        uses: actions/upload-artifact@v4
        with:
          name: Sidekin-macOS-arm64-${{ github.sha }}
          path: |
            artifacts/Sidekin-macOS-arm64.zip
            artifacts/Sidekin-macOS-arm64.RELEASE.json
            artifacts/Sidekin-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
