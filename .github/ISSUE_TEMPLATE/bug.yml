name: Bug report
description: Report a reproducible Sidekin defect without private data
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, prompts, code, personal paths, session IDs, app-data files, or paid API responses. Report vulnerabilities privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Sidekin version or commit
      placeholder: 2.2.0-beta.1 or full Git commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS 13 or newer
        - Windows 10
        - Windows 11
        - Other or unsupported
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Floating companion
        - Care, growth, or migration
        - Codex integration
        - Claude Code integration
        - Pet Workshop
        - Pet Pack
        - Build, test, or packaging
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use neutral workspace names and the smallest deterministic example.
      placeholder: "1. Start Sidekin at commit...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, prompts, replies, proprietary code, full paths, and personal identifiers.
          required: true
        - label: I searched existing issues and this is not a public vulnerability report.
          required: true
