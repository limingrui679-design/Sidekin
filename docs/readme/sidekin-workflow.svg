<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="260" viewBox="0 0 1440 260" role="img" aria-labelledby="title description">
  <title id="title">Sidekin local companion workflow</title>
  <description id="description">Four compact steps connect bounded Codex lifecycle metadata to local classification, deterministic care and growth, and the floating companion.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f26"/>
      <stop offset="1" stop-color="#171038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26c6c3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="260" rx="28" fill="url(#background)"/>
  <path d="M330 130H390M690 130H750M1050 130H1110" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M378 118L392 130L378 142M738 118L752 130L738 142M1098 118L1112 130L1098 142" fill="none" stroke="#76e6df" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(50 40)">
      <rect width="280" height="180" rx="22" fill="#111a39" stroke="#2b4b71" stroke-width="2"/>
      <circle cx="42" cy="42" r="22" fill="#163958"/><path d="M31 43h7l5-12 8 24 6-12h9" fill="none" stroke="#66e7e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="49" fill="#8fece7" font-size="18" font-weight="700">01 · LISTEN</text>
      <text x="28" y="100" fill="#ffffff" font-size="24" font-weight="700">Codex lifecycle</text>
      <text x="28" y="134" fill="#aebbd5" font-size="17">state · turn ID · workspace</text>
      <text x="28" y="160" fill="#7f91b5" font-size="15">No prompt, response, or code</text>
    </g>
    <g transform="translate(410 40)">
      <rect width="280" height="180" rx="22" fill="#15183c" stroke="#464271" stroke-width="2"/>
      <circle cx="42" cy="42" r="22" fill="#2b265d"/><path d="M31 35h22M31 43h14M31 51h26" stroke="#b69cff" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="49" fill="#c5b4ff" font-size="18" font-weight="700">02 · CLASSIFY</text>
      <text x="28" y="100" fill="#ffffff" font-size="24" font-weight="700">Bounded task state</text>
      <text x="28" y="134" fill="#aebbd5" font-size="17">running · completed · failed</text>
      <text x="28" y="160" fill="#7f91b5" font-size="15">Deduplicated before rewards</text>
    </g>
    <g transform="translate(770 40)">
      <rect width="280" height="180" rx="22" fill="#17163d" stroke="#58406e" stroke-width="2"/>
      <circle cx="42" cy="42" r="22" fill="#392250"/><path d="M42 55C28 46 29 34 36 31c4-2 7 0 9 4 2-4 6-6 10-4 7 4 7 16-13 24Z" fill="#f58ac8"/>
      <text x="76" y="49" fill="#f4a9d4" font-size="18" font-weight="700">03 · EVOLVE</text>
      <text x="28" y="100" fill="#ffffff" font-size="24" font-weight="700">Care + growth engine</text>
      <text x="28" y="134" fill="#aebbd5" font-size="17">mood · energy · five stages</text>
      <text x="28" y="160" fill="#7f91b5" font-size="15">Deterministic and locally persisted</text>
    </g>
    <g transform="translate(1130 40)">
      <rect width="260" height="180" rx="22" fill="#17183a" stroke="#4f4279" stroke-width="2"/>
      <circle cx="42" cy="42" r="22" fill="#2f275a"/><path d="M32 49c2-16 18-22 27-9 7 11-3 24-15 20-8-2-13-5-12-11Z" fill="none" stroke="#a88dff" stroke-width="4"/><circle cx="40" cy="44" r="2.5" fill="#a88dff"/><circle cx="51" cy="44" r="2.5" fill="#a88dff"/>
      <text x="76" y="49" fill="#c1b0ff" font-size="18" font-weight="700">04 · RESPOND</text>
      <text x="28" y="100" fill="#ffffff" font-size="24" font-weight="700">Floating companion</text>
      <text x="28" y="134" fill="#aebbd5" font-size="17">motion · task cards · care</text>
      <text x="28" y="160" fill="#7f91b5" font-size="15">Always visible, local-first</text>
    </g>
  </g>
</svg>
